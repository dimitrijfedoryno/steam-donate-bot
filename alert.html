<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <style>
        /* Reset okrajů a nastavení plné výšky */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: transparent;
        }

        /* Kontejner, který vycentruje alert nebo ho roztáhne */
        #container {
            display: flex;
            justify-content: center; /* Vycentrování horizontálně */
            align-items: flex-start; /* Zarovnání k hornímu okraji (lze změnit na center) */
            width: 100%;
            height: 100%;
            padding-top: 50px; /* Mezera od horního okraje OBS zdroje */
        }

        #alert-box {
            /* Šířka se přizpůsobí obsahu, max 90% šířky zdroje */
            width: 90%; 
            max-width: 600px; 
            background: linear-gradient(135deg, rgba(20, 20, 20, 0.95) 0%, rgba(45, 45, 45, 0.9) 100%);
            border-left: 10px solid #a4d007;
            color: white;
            padding: 30px;
            border-radius: 0 20px 20px 0;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
            font-family: 'Arial Black', sans-serif;

            /* Animace (vjezd shora) */
            opacity: 0;
            transform: translateY(-200px);
            transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #alert-box.show {
            opacity: 1;
            transform: translateY(0);
        }

        .label { 
            color: #a4d007; 
            font-size: 1.2rem; 
            text-transform: uppercase; 
            letter-spacing: 3px;
            margin-bottom: 10px;
        }

        .user-name { 
            font-size: 3rem; 
            margin: 5px 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .total-value { 
            font-size: 4rem; 
            color: #ffcc00; 
            text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
        }

        .sub-text { 
            font-size: 1.4rem; 
            color: #bbb; 
            margin-top: 15px; 
            font-family: 'Segoe UI', sans-serif;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 10px;
        }
    </style>
</head>
<body>

<div id="container">
    <div id="alert-box">
        <div class="label">Nová Nabídka</div>
        <div id="user" class="user-name">Uživatel</div>
        <div class="total-value">$<span id="total">0.00</span></div>
        <div class="sub-text">Nejdražší: <span id="item" style="color:#fff">---</span></div>
    </div>
</div>

<script>
    let lastProcessedTimestamp = 0;
    const JSON_PATH = 'logs/alert_data.json'; 

    async function checkAlert() {
        try {
            const response = await fetch(JSON_PATH + '?t=' + Date.now());
            if (!response.ok) return;
            const data = await response.json();

            if (data.timestamp > lastProcessedTimestamp) {
                if (lastProcessedTimestamp !== 0) {
                    displayAlert(data);
                }
                lastProcessedTimestamp = data.timestamp;
            }
        } catch (e) {}
    }

    function displayAlert(data) {
        document.getElementById('user').innerText = data.username;
        document.getElementById('total').innerText = data.total;
        document.getElementById('item').innerText = data.topItem;
        
        const box = document.getElementById('alert-box');
        box.classList.add('show');
        
        setTimeout(() => {
            box.classList.remove('show');
        }, 8000);
    }

    setInterval(checkAlert, 1000);
</script>
</body>
</html>
