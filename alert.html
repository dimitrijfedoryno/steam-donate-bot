<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: transparent;
        }

        #container {
            display: flex;
            justify-content: center; 
            align-items: flex-start; 
            width: 100%;
            height: 100%;
            padding-top: 50px; 
        }

        #alert-box {
            width: 90%; 
            max-width: 600px; 
            background: linear-gradient(135deg, rgba(20, 20, 20, 0.95) 0%, rgba(45, 45, 45, 0.9) 100%);
            border-left: 10px solid #a4d007;
            color: white;
            padding: 30px;
            border-radius: 0 20px 20px 0;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
            font-family: 'Arial Black', sans-serif;
            opacity: 0;
            transform: translateY(-200px);
            transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #alert-box.show {
            opacity: 1;
            transform: translateY(0);
        }

        .label { color: #a4d007; font-size: 1.2rem; text-transform: uppercase; letter-spacing: 3px; margin-bottom: 10px; }
        .user-name { font-size: 3rem; margin: 5px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .total-value { font-size: 4rem; color: #ffcc00; text-shadow: 2px 2px 10px rgba(0,0,0,0.5); }
        .sub-text { font-size: 1.4rem; color: #bbb; margin-top: 15px; font-family: 'Segoe UI', sans-serif; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 10px; }

        #goal-bar-wrap {
            margin-top: 20px;
            width: 100%;
            display: none;
        }
        #goal-bar-bg {
            width: 100%;
            height: 20px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            overflow: hidden;
        }
        #goal-fill {
            height: 100%;
            background: linear-gradient(90deg, #a4d007, #ffcc00);
            border-radius: 10px;
            transition: width 1s ease-out;
            width: 0%;
        }
        #goal-text {
            text-align: center;
            font-size: 0.8rem;
            color: #aaa;
            margin-top: 5px;
        }
    </style>
</head>
<body>

<audio id="trade-sound" src="sounds/trade.mp3" preload="auto" muted></audio>

<div id="container">
    <div id="alert-box">
        <div class="label">Nová Nabídka</div>
        <div id="user" class="user-name">Uživatel</div>
        <div class="total-value">$<span id="total">0.00</span></div>
        <div class="sub-text">Nejdražší: <span id="item" style="color:#fff">---</span></div>
        <div id="goal-bar-wrap">
            <div id="goal-bar-bg"><div id="goal-fill"></div></div>
            <div id="goal-text"></div>
        </div>
    </div>
</div>

<script>
    let playQueue = [];
    let isPlaying = false;
    let settings = {};
    let audioReady = false;

    // --- Audio unlock ---
    const sound = document.getElementById('trade-sound');

    // 1) Zkusíme přehrát hned po loadu (muted autoplay je povolený)
    sound.play().then(() => {
        sound.pause();
        sound.currentTime = 0;
        audioReady = true;
    }).catch(() => {});

    // 2) Fallback: Web Audio API oscillator (pomáhá v OBS)
    try {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (Ctx) {
            const ctx = new Ctx();
            if (ctx.state === 'suspended') ctx.resume();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            gain.gain.value = 0.001;
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(0);
            osc.stop(0.05);
        }
    } catch (e) {}

    // 3) Kliknutí/touch jako fallback pro prohlížeče
    function onClickUnlock() {
        sound.muted = false;
        sound.play().then(() => {
            sound.pause();
            sound.currentTime = 0;
            audioReady = true;
        }).catch(() => {});
    }
    document.addEventListener('click', onClickUnlock, { once: true });
    document.addEventListener('touchstart', onClickUnlock, { once: true });

    // 4) Po 500 ms zkusíme znovu (některé prohlížeče potřebují víc času)
    setTimeout(() => {
        if (!audioReady) {
            sound.play().then(() => {
                sound.pause();
                sound.currentTime = 0;
                audioReady = true;
            }).catch(() => {});
        }
    }, 500);

    // --- Nastavení zvuku (pouze pokud se změnil) ---
    let lastSoundUrl = '';

    function setSound(url) {
        if (url === lastSoundUrl) return;
        lastSoundUrl = url;
        sound.src = url;
        sound.load();
        // Zkusíme znovu odemknout s novým zdrojem
        sound.play().then(() => {
            sound.pause();
            sound.currentTime = 0;
            audioReady = true;
        }).catch(() => {});
    }

    // --- Settings ---
    async function loadSettings() {
        try {
            const res = await fetch('/api/settings');
            if (res.ok) {
                settings = await res.json();
                applySettings();
            }
        } catch (e) {
            console.error('Nepodařilo se načíst nastavení:', e);
        }
    }

    function applySettings() {
        const box = document.getElementById('alert-box');
        const label = document.querySelector('.label');
        const totalVal = document.querySelector('.total-value');

        if (settings.alert_primary_color) {
            box.style.borderLeftColor = settings.alert_primary_color;
            if (label) label.style.color = settings.alert_primary_color;
        }
        if (settings.alert_secondary_color) {
            if (totalVal) totalVal.style.color = settings.alert_secondary_color;
        }
        if (settings.alert_font_family) {
            box.style.fontFamily = settings.alert_font_family;
        }
        if (settings.alert_sound) {
            setSound(settings.alert_sound);
        }
    }

    function updateGoalBar() {
        const wrap = document.getElementById('goal-bar-wrap');
        const fill = document.getElementById('goal-fill');
        const text = document.getElementById('goal-text');
        if (settings.donation_goal > 0) {
            wrap.style.display = 'block';
            const pct = Math.min(100, (settings.donation_current || 0) / settings.donation_goal * 100);
            fill.style.width = pct + '%';
            text.textContent = 'Cíl: $' + settings.donation_goal.toFixed(2) + ' | ' + pct.toFixed(1) + '%';
        } else {
            wrap.style.display = 'none';
        }
    }

    // --- Alert polling ---
    async function pollNext() {
        try {
            const response = await fetch(`/api/alert/next?t=${Date.now()}`);
            if (!response.ok) return;
            const data = await response.json();
            if (data) {
                playQueue.push(data);
                if (!isPlaying) playNext();
            }
        } catch (e) {
            console.error("Chyba:", e);
        }
    }

    function playNext() {
        if (playQueue.length === 0) { isPlaying = false; return; }
        isPlaying = true;
        const data = playQueue.shift();
        displayAlert(data, () => {
            setTimeout(playNext, 500);
        });
    }

    function displayAlert(data, onDone) {
        document.getElementById('user').innerText = data.username;
        document.getElementById('total').innerText = data.total;
        document.getElementById('item').innerText = data.topItem;
        
        const duration = (settings.alert_duration || 8) * 1000;

        sound.muted = false;
        sound.currentTime = 0;
        sound.play().catch(() => {});

        updateGoalBar();

        const box = document.getElementById('alert-box');
        box.classList.add('show');
        
        setTimeout(() => {
            box.classList.remove('show');
            if (onDone) onDone();
        }, duration);
    }

    loadSettings();
    setInterval(pollNext, 1000);
    setInterval(() => {
        fetch('/api/settings').then(r => r.ok && r.json()).then(s => {
            if (s && JSON.stringify(s) !== JSON.stringify(settings)) {
                settings = s;
                applySettings();
            }
            updateGoalBar();
        }).catch(() => {});
    }, 5000);
</script>
</body>
</html>
