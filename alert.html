<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Steam Donation Alert</title>
    <style>
        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            overflow: hidden; 
            background-color: transparent; /* Důležité pro OBS */
        }

        #alert-box {
            position: absolute;
            top: 50px;
            left: 50px;
            width: 450px;
            background: linear-gradient(90deg, rgba(20, 20, 20, 0.95) 0%, rgba(40, 40, 40, 0.8) 100%);
            border-left: 8px solid #a4d007; /* CS2 zelená */
            color: white;
            padding: 25px;
            border-radius: 0 15px 15px 0;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            
            /* Animace schování */
            transform: translateX(-600px);
            transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
        }

        #alert-box.show {
            transform: translateX(0);
        }

        .title { 
            color: #a4d007; 
            text-transform: uppercase; 
            font-weight: 900; 
            letter-spacing: 2px;
            font-size: 0.9em;
            margin-bottom: 5px;
        }

        .user-name {
            font-size: 1.8em;
            font-weight: bold;
            margin-bottom: 10px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .amount { 
            font-size: 2.2em; 
            color: #ffffff; 
            font-weight: 900;
        }

        .top-item { 
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px solid rgba(255,255,255,0.1);
            font-size: 0.95em; 
            color: #ccc; 
        }

        .item-name {
            color: #eb4b4b; /* Barva pro dražší itemy */
            font-weight: bold;
        }
    </style>
</head>
<body>

<div id="alert-box">
    <div class="title">Nová Steam Nabídka</div>
    <div id="user" class="user-name">Načítání...</div>
    <div class="amount"><span id="total">0.00</span> USD</div>
    <div class="top-item">Nejdražší kousek:<br><span id="item" class="item-name">---</span></div>
</div>

<script>
    let lastTimestamp = 0;
    // Tady nastavíme cestu k souboru - pokud máš alert.html v hlavní složce
    // a JSON v logs/, pak je cesta 'logs/alert_data.json'
    const JSON_PATH = 'logs/alert_data.json'; 

    async function checkAlert() {
        try {
            // Přidáváme ?t=timestamp, aby prohlížeč pokaždé stáhl čerstvý soubor
            const response = await fetch(JSON_PATH + '?t=' + Date.now());
            if (!response.ok) throw new Error('Soubor nenalezen');
            
            const data = await response.json();

            // Kontrola, jestli jde o nový dar
            if (data.timestamp > lastTimestamp) {
                // Pokud je to úplně první načtení po zapnutí stránky, 
                // jen uložíme čas a neukazujeme alert (aby nevyskočil starý dar)
                if (lastTimestamp === 0) {
                    lastTimestamp = data.timestamp;
                    return;
                }

                lastTimestamp = data.timestamp;
                showAlert(data);
            }
        } catch (e) {
            console.error("Chyba při načítání JSONu:", e);
        }
    }

    function showAlert(data) {
        document.getElementById('user').innerText = data.username;
        document.getElementById('total').innerText = data.total;
        document.getElementById('item').innerText = data.topItem + " ($" + data.topItemPrice + ")";
        
        const box = document.getElementById('alert-box');
        box.classList.add('show');
        
        // Zvukový efekt (pokud máš v logs/ složce sound.mp3)
        // new Audio('logs/alert.mp3').play().catch(e => console.log('Audio disabled'));

        // Po 10 sekundách alert schováme
        setTimeout(() => {
            box.classList.remove('show');
        }, 10000);
    }

    // Interval kontroly (1000ms = 1 sekunda)
    setInterval(checkAlert, 1000);
</script>
</body>
</html>
